name: Browser acceptance

# Real-page journeys plus an axe gate. Not a required check: headless browser
# jobs can flake, so a failure here is investigated rather than auto-blocking.
on:
  pull_request:
    paths:
      - "index.html"
      - "404.html"
      - "apps/*/standalone.html"
      - "scripts/apps.mjs"
      - "scripts/browser-smoke.mjs"
      - "scripts/serve.mjs"
      - ".github/workflows/browser.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  journeys:
    name: Browser journeys and axe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          package-manager-cache: false
      # Both packages have zero dependencies. They are installed outside the
      # checkout without lifecycle scripts, and no browser is downloaded: the
      # runner's preinstalled Google Chrome is used.
      - name: Install pinned browser tooling outside the project
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix "$RUNNER_TEMP/browser-tools" playwright-core@1.55.0 axe-core@4.10.3
      - name: Run browser journeys with the axe gate
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tools/node_modules/playwright-core" AXE_MODULE="$RUNNER_TEMP/browser-tools/node_modules/axe-core" BROWSER_EXECUTABLE="$(command -v google-chrome)" npm run test:browser
