name: Weekend Gap

on:
  push:
    branches: [main]
    paths:
      - "apps/weekend-gap/**"
      - ".github/workflows/weekend-gap.yml"
  pull_request:
    paths:
      - "apps/weekend-gap/**"
      - ".github/workflows/weekend-gap.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.x"
          package-manager-cache: false
      - name: Run deterministic tests
        run: npm test
        working-directory: apps/weekend-gap
      - name: Check repository integrity
        run: npm run check
        working-directory: apps/weekend-gap
