name: The Smallest Agreement

on:
  push:
    branches: [main]
    paths:
      - "apps/smallest-agreement/**"
      - ".github/workflows/smallest-agreement.yml"
  pull_request:
    paths:
      - "apps/smallest-agreement/**"
      - ".github/workflows/smallest-agreement.yml"

permissions:
  contents: read

concurrency:
  group: smallest-agreement-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20.x", "22.x"]
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Check syntax and standalone artifact
        run: npm run check
        working-directory: apps/smallest-agreement
      - name: Run tests
        run: npm test
        working-directory: apps/smallest-agreement
