name: Common Cart

on:
  push:
    branches: [main]
    paths:
      - "apps/common-cart/**"
      - ".github/workflows/common-cart.yml"
  pull_request:
    paths:
      - "apps/common-cart/**"
      - ".github/workflows/common-cart.yml"

permissions:
  contents: read

concurrency:
  group: common-cart-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20.x", "22.x", "24.x"]
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Run deterministic tests
        run: npm test
        working-directory: apps/common-cart
      - name: Check repository integrity and standalone build
        run: npm run check
        working-directory: apps/common-cart
